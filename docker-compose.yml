services:
  vault-demo:
    build: .
    image: local/perseus-vault-demo:git-main
    container_name: perseus-vault-demo
    restart: unless-stopped
    networks:
      - media-net
    ports:
      - "8092:8092"
    environment:
      PERSEUS_VAULT_BIN: /usr/local/bin/perseus-vault
      DEMO_DB: /data/demo.db
      PORT: "8092"
      VAULT_VERSION: "2.22.0"
      SOURCE_REPOSITORY: https://github.com/Perseus-Computing-LLC/perseus-vault-demo
      SOURCE_REVISION: main
      LEDGER_URL: https://ledger.perseus.observer
      # Set LEDGER_ORG and LEDGER_API_KEY only in Portainer's protected
      # environment values when enabling scoped evidence inspection.
      LEDGER_ORG: ${LEDGER_ORG:-}
      LEDGER_API_KEY: ${LEDGER_API_KEY:-}
      LEDGER_EXTERNAL_REF: vault-demo
    volumes:
      - perseus-vault-demo-data:/data

networks:
  media-net:
    external: true
    name: media-net

volumes:
  perseus-vault-demo-data:
    external: true
